<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>mock-services — social preview (ru)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
  :root {
    /* Brand tokens — VitePress indigo (источник: axiiom.ru/mock-services) */
    --brand-1: #3451b2;
    --brand-2: #3a5ccc;
    --brand-3: #3e63dd;
    --brand-dark-1: #a8b1ff;
    --brand-soft: rgba(100, 108, 255, .14);

    /* Deep-indigo surface (тёмный вариант — максимальная читаемость) */
    --bg-0: #0f1428;
    --bg-1: #151c3c;
    --bg-2: #1c2a60;

    --ink: #f4f6ff;
    --ink-dim: #c3cae8;
    --ink-mute: #9aa3cc;
    --rule: rgba(168, 177, 255, .26);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1280px; height: 640px; overflow: hidden; }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Full-bleed hero; padding 40pt — crop-safe зона GitHub, важное не граничит с краями */
  .hero {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 40pt;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: var(--ink);
    background:
      radial-gradient(1080px 620px at 86% -14%, rgba(62, 99, 221, .48), transparent 60%),
      radial-gradient(760px 520px at -10% 116%, rgba(100, 108, 255, .22), transparent 58%),
      linear-gradient(135deg, var(--bg-0) 0%, var(--bg-1) 54%, var(--bg-2) 100%);
  }

  /* Верхняя строка: бренд-эйрбрау + число адаптеров */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px 9px 14px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: var(--brand-soft);
    color: var(--brand-dark-1);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .eyebrow .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--brand-dark-1);
    box-shadow: 0 0 0 4px rgba(168, 177, 255, .18);
  }

  .count {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: .02em;
    color: var(--ink-mute);
  }

  /* Lead-блок: заголовок + подзаголовок */
  .lead { max-width: 1040px; }

  h1 {
    font-size: 68px;
    line-height: 1.06;
    font-weight: 800;
    letter-spacing: -.02em;
    color: var(--ink);
  }
  h1 .accent { color: var(--brand-dark-1); }

  .sub {
    margin-top: 22px;
    max-width: 1000px;
    font-size: 26px;
    line-height: 1.45;
    font-weight: 400;
    color: var(--ink-dim);
  }

  /* Нижняя строка: репозиторий + лицензия */
  .foot {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    font-size: 18px;
    font-weight: 500;
    color: var(--ink-mute);
  }
  .foot .repo { color: var(--brand-dark-1); font-weight: 600; }
  .foot .sep { color: rgba(154, 163, 204, .6); }
</style>
</head>
<body>
  <section class="hero">
    <div class="top">
      <span class="eyebrow"><span class="dot"></span>AXIIOM · Mock Services</span>
      <span class="count">10 адаптеров</span>
    </div>

    <div class="lead">
      <h1>Моки банков и касс<br>для <span class="accent">тестирования API</span></h1>
      <p class="sub">Открытый тестовый стенд: эквайринг, облачные кассы и ОФД по официальным API-протоколам. Быстрый запуск, сценарии отказов и гайды интеграции за 10 минут.</p>
    </div>

    <div class="foot">
      <span class="repo">github.com/rucorp/mock-services</span>
      <span class="sep">·</span>
      <span>Apache-2.0</span>
    </div>
  </section>
</body>
</html>
