name: CI

# Раннер закреплён явно (ubuntu-24.04): страховка от авто-миграции
# `ubuntu-latest` → Ubuntu 26.04. Апгрейд — отдельным контролируемым PR (MS-40).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # MS-40: матрица на поддерживаемых LTS. Node 18 — EOL, снят с CI
        # (код остаётся совместим с ≥18; минимум-политика — решение владельца).
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # Зависимостей нет (zero-dependency) — install нужен только для корректного npm-контекста
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: selftest ядра
        run: npm run test:core
      - name: selftest мока Т-Банка
        run: npm run test:tbank
      - name: selftest мока кассы
        run: npm run test:kassa
      - name: selftest мока ЮKassa
        run: npm run test:yookassa
      - name: selftest мока АТОЛ Онлайн v4
        run: npm run test:atol
      - name: selftest мока Альфа-Банка
        run: npm run test:alfa
      - name: selftest мока Сбербанк Ecom REST
        run: npm run test:sber
      - name: selftest мока ВТБ SMB E-commerce
        run: npm run test:vtb
      - name: selftest мока Первого ОФД (облачная касса OKassa)
        run: npm run test:first-ofd
      - name: selftest мока Контур.ОФД (read/reconciliation)
        run: npm run test:kontur-ofd
      - name: офлайн selftest синхронизатора upstream snapshot
        run: npm run test:upstream
      - name: проверка относительных ссылок документации
        run: npm run check:links
      - name: детектор дрейфа протоколов и OpenAPI 3.1
        run: npm run check:drift

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Проверка prod-изоляции docker-compose.include.yml (без профиля mock сервисы не поднимаются)
        run: |
          SERVICES_DEFAULT=$(docker compose -f docker-compose.include.yml config --services)
          if [ -n "$SERVICES_DEFAULT" ]; then
            echo "ОШИБКА: без профиля mock compose вернул сервисы: $SERVICES_DEFAULT"
            exit 1
          fi
          SERVICES_MOCK=$(docker compose -f docker-compose.include.yml --profile mock config --services | sort | tr '\n' ' ')
          echo "Сервисы в профиле mock: $SERVICES_MOCK"
          echo "$SERVICES_MOCK" | grep -q "tbank-mock"
          echo "$SERVICES_MOCK" | grep -q "kassa-mock"
          echo "$SERVICES_MOCK" | grep -q "yookassa-mock"
          echo "$SERVICES_MOCK" | grep -q "atol-mock"
          echo "$SERVICES_MOCK" | grep -q "alfa-mock"
          echo "$SERVICES_MOCK" | grep -q "sber-mock"
          echo "$SERVICES_MOCK" | grep -q "vtb-mock"
          echo "$SERVICES_MOCK" | grep -q "first-ofd-mock"
      - name: Проверка безопасного bind root compose и явного сетевого override
        run: |
          docker compose config --format json > /tmp/mock-compose-default.json
          jq -e 'any(.services["tbank-mock"].ports[]; .host_ip == "127.0.0.1" and .target == 3100) and any(.services["kassa-mock"].ports[]; .host_ip == "127.0.0.1" and .target == 3101)' /tmp/mock-compose-default.json
          MOCK_TBANK_BIND_IP=0.0.0.0 MOCK_KASSA_BIND_IP=0.0.0.0 docker compose config --format json > /tmp/mock-compose-network.json
          jq -e 'any(.services["tbank-mock"].ports[]; .host_ip == "0.0.0.0" and .target == 3100) and any(.services["kassa-mock"].ports[]; .host_ip == "0.0.0.0" and .target == 3101)' /tmp/mock-compose-network.json
      - name: Сборка образа
        run: docker build -t mock-services:local .
      - name: "Image smoke (F-35/F-36): непривилегированный запуск, healthcheck tbank+kassa, persist/restore при --read-only"
        run: MOCK_SMOKE_IMAGE=mock-services:local MOCK_SMOKE_SKIP_BUILD=1 node scripts/docker-smoke.js
      - name: Запуск compose-стенда и ожидание healthcheck
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3100/health >/dev/null && curl -fsS http://localhost:3101/healthz >/dev/null && curl -fsS http://localhost:3102/health >/dev/null && curl -fsS http://localhost:3103/health >/dev/null && curl -fsS http://localhost:3104/health >/dev/null && curl -fsS http://localhost:3105/health >/dev/null && curl -fsS http://localhost:3106/health >/dev/null && curl -fsS http://localhost:3107/health >/dev/null; then
              echo "стенд поднялся"; exit 0
            fi
            sleep 1
          done
          echo "стенд не поднялся за 30 с"; docker compose logs; exit 1
      - name: Black-box selftest против контейнеров compose (:3100–:3107)
        run: npm run test:compose
      - name: Прогон selftest-наборов внутри собранного образа
        run: |
          docker compose exec -T tbank-mock node packages/core/selftest.js
          docker compose exec -T tbank-mock node services/tbank-mock/selftest.js
          docker compose exec -T kassa-mock node services/kassa-mock/selftest.js
          docker compose exec -T yookassa-mock node services/yookassa-mock/selftest.js
          docker compose exec -T atol-mock node services/atol-mock/selftest.js
          docker compose exec -T alfa-mock node services/alfa-mock/selftest.js
          docker compose exec -T sber-mock node services/sber-mock/selftest.js
          docker compose exec -T vtb-mock node services/vtb-mock/selftest.js
          docker compose exec -T first-ofd-mock node services/first-ofd-mock/selftest.js
      - name: Логи и остановка
        if: always()
        run: docker compose down -v

  publish-ghcr:
    name: Публикация образа в GHCR
    needs: [test, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Вход в GitHub Container Registry (ghcr.io)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Вычисление тегов образа (semver + latest + sha)
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
      - name: Сборка и публикация ghcr.io/rucorp/mock-services
        run: |
          IMAGE="ghcr.io/rucorp/mock-services"
          VER="${{ steps.meta.outputs.version }}"
          SHA="${{ steps.meta.outputs.short_sha }}"
          docker build \
            -t "${IMAGE}:${VER}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-${SHA}" \
            .
          docker push "${IMAGE}:${VER}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${SHA}"
