name: CI

# Джобы `test` и `docker` для pull request и push в `main` берут раннер из
# переменной репозитория `CI_RUNNER` (self-hosted раннер организации, лейбл
# задаёт владелец переменной) с fallback на закреплённый `ubuntu-24.04`
# (страховка от авто-миграции `ubuntu-latest` → Ubuntu 26.04; апгрейд —
# отдельным PR, MS-40). Для тегов `v*` раннер форсируется на `ubuntu-24.04`
# (GitHub-hosted) — независимый пруф валидности релиза. Джоб `docker` публикует хостовые
# порты, ремапнутые в свободный диапазон 3910–3917 (см. env джоба): на
# разделяемом self-hosted хосте порты 3100–3101 могут быть заняты, а публичный
# URL следует за host-портом (MS-22).
# Джоб `publish-ghcr` — только по тегам `v*`, на `ubuntu-24.04` (публикация образа, без портов).
# CI-политика (2026-10-15): полный гейт (матрица Node + docker) — на pull request с кодом
# и на теги; при изменениях только документации — лёгкая job «Docs checks» (docs-checks.yml);
# push в `main` — один Node (smoke); публикация образа — только по тегам.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

jobs:
  test:
    # Релизный гейт (тег v*) — на GitHub-hosted: независимый от self-hosted прогон
    # как пруф валидности релиза. PR и push в main — на CI_RUNNER (self-hosted).
    runs-on: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        # MS-40: поддерживаемые LTS. CI-политика (2026-10-15): полная матрица —
        # для PR с кодом и тегов `v*`; push в `main` — smoke на одном Node.
        node: ${{ ((github.event_name == 'pull_request') || startsWith(github.ref, 'refs/tags/v')) && fromJSON('["20","22","24"]') || fromJSON('["22"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # Зависимостей нет (zero-dependency) — install нужен только для корректного npm-контекста
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: selftest ядра
        run: npm run test:core
      - name: selftest мока Т-Банка
        run: npm run test:tbank
      - name: selftest мока кассы
        run: npm run test:kassa
      - name: selftest мока ЮKassa
        run: npm run test:yookassa
      - name: selftest мока АТОЛ Онлайн v4
        run: npm run test:atol
      - name: selftest мока Альфа-Банка
        run: npm run test:alfa
      - name: selftest мока Сбербанк Ecom REST
        run: npm run test:sber
      - name: selftest мока ВТБ SMB E-commerce
        run: npm run test:vtb
      - name: selftest мока Первого ОФД (облачная касса OKassa)
        run: npm run test:first-ofd
      - name: selftest мока Контур.ОФД (read/reconciliation)
        run: npm run test:kontur-ofd
      - name: selftest мока Такском (read-only кабинет/ОФД, API v2)
        run: npm run test:taxcom
      - name: проверка относительных ссылок документации
        run: npm run check:links
      - name: шаблон гайдов интеграции и README ↔ services/*
        run: npm run check:guides
      - name: реестр markdown-таблиц (docs/tables.md)
        run: npm run check:tables
      - name: env-контракт сервисов (правило пяти мест, AGENTS.md §5)
        run: npm run check:env
      - name: лицензионные шапки документов (R-01)
        run: npm run check:copyright
      - name: детектор дрейфа протоколов и OpenAPI 3.1
        run: npm run check:drift

  docker:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    env:
      # Порт-ремап в свободный диапазон: на разделяемом self-hosted хосте
      # порты 3100–3107 могут быть заняты. Публичные URL следуют за
      # host-портом (MS-22), MOCK_*_URL — black-box test:compose снаружи.
      # taxcom-mock (#112) получает 3918: 3910–3917 уже заняты восемью сервисами.
      MOCK_TBANK_HOST_PORT: '3910'
      MOCK_KASSA_HOST_PORT: '3911'
      MOCK_YOOKASSA_HOST_PORT: '3912'
      MOCK_ATOL_HOST_PORT: '3913'
      MOCK_ALFA_HOST_PORT: '3914'
      MOCK_SBER_HOST_PORT: '3915'
      MOCK_VTB_HOST_PORT: '3916'
      MOCK_FIRST_OFD_HOST_PORT: '3917'
      MOCK_TAXCOM_HOST_PORT: '3918'
      MOCK_TBANK_URL: 'http://127.0.0.1:3910'
      MOCK_KASSA_URL: 'http://127.0.0.1:3911'
      MOCK_YOOKASSA_URL: 'http://127.0.0.1:3912'
      MOCK_ATOL_URL: 'http://127.0.0.1:3913'
      MOCK_ALFA_URL: 'http://127.0.0.1:3914'
      MOCK_SBER_URL: 'http://127.0.0.1:3915'
      MOCK_VTB_URL: 'http://127.0.0.1:3916'
      MOCK_FIRST_OFD_URL: 'http://127.0.0.1:3917'
      # MOCK_TAXCOM_URL не задаётся: black-box test:compose такском не покрывает
      # (как и kontur-ofd); образ проверяется в image smoke (health/OpenAPI/selftest).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Проверка prod-изоляции docker-compose.include.yml (без профиля mock сервисы не поднимаются)
        run: |
          SERVICES_DEFAULT=$(docker compose -f docker-compose.include.yml config --services)
          if [ -n "$SERVICES_DEFAULT" ]; then
            echo "ОШИБКА: без профиля mock compose вернул сервисы: $SERVICES_DEFAULT"
            exit 1
          fi
          SERVICES_MOCK=$(docker compose -f docker-compose.include.yml --profile mock config --services | sort | tr '\n' ' ')
          echo "Сервисы в профиле mock: $SERVICES_MOCK"
          echo "$SERVICES_MOCK" | grep -q "tbank-mock"
          echo "$SERVICES_MOCK" | grep -q "kassa-mock"
          echo "$SERVICES_MOCK" | grep -q "yookassa-mock"
          echo "$SERVICES_MOCK" | grep -q "atol-mock"
          echo "$SERVICES_MOCK" | grep -q "alfa-mock"
          echo "$SERVICES_MOCK" | grep -q "sber-mock"
          echo "$SERVICES_MOCK" | grep -q "vtb-mock"
          echo "$SERVICES_MOCK" | grep -q "first-ofd-mock"
          echo "$SERVICES_MOCK" | grep -q "kontur-ofd-mock"
          echo "$SERVICES_MOCK" | grep -q "taxcom-mock"
      - name: Проверка безопасного bind root compose и явного сетевого override
        run: |
          docker compose config --format json > /tmp/mock-compose-default.json
          jq -e 'any(.services["tbank-mock"].ports[]; .host_ip == "127.0.0.1" and .target == 3100) and any(.services["kassa-mock"].ports[]; .host_ip == "127.0.0.1" and .target == 3101)' /tmp/mock-compose-default.json
          MOCK_TBANK_BIND_IP=0.0.0.0 MOCK_KASSA_BIND_IP=0.0.0.0 docker compose config --format json > /tmp/mock-compose-network.json
          jq -e 'any(.services["tbank-mock"].ports[]; .host_ip == "0.0.0.0" and .target == 3100) and any(.services["kassa-mock"].ports[]; .host_ip == "0.0.0.0" and .target == 3101)' /tmp/mock-compose-network.json
      - name: Проверка контейнерного харденинга (MS-04) во всех трёх compose
        run: |
          # MS-04: каждый сервис любого compose обязан иметь полный набор
          # (init/read_only/tmpfs /tmp/cap_drop ALL/no-new-privileges/pids_limit);
          # отсутствие любого ключа — красный шаг.
          assert_hardening() {
            if jq -e 'all(.services[];
              (.init == true)
              and (.read_only == true)
              and (((.tmpfs // []) | tostring | contains("/tmp")))
              and ((.cap_drop // []) | index("ALL"))
              and ((.security_opt // []) | index("no-new-privileges:true"))
              and (.pids_limit == 256))' "$1" > /dev/null; then
              echo "$2: харденинг OK"
            else
              echo "ОШИБКА: $2 — не у всех сервисов init/read_only/tmpfs/cap_drop/no-new-privileges/pids_limit"
              exit 1
            fi
          }
          docker compose config --format json > /tmp/mock-compose-hardening.json
          assert_hardening /tmp/mock-compose-hardening.json docker-compose.yml
          docker compose -f docker-compose.include.yml --profile mock config --format json > /tmp/mock-compose-include-hardening.json
          assert_hardening /tmp/mock-compose-include-hardening.json docker-compose.include.yml
          docker compose -f docker-compose.staging.yml config --format json > /tmp/mock-compose-staging-hardening.json
          assert_hardening /tmp/mock-compose-staging-hardening.json docker-compose.staging.yml
      - name: Сборка образа
        run: docker build -t mock-services:local .
      - name: "Image smoke (F-35/F-36): непривилегированный запуск, healthcheck tbank+kassa, persist/restore при --read-only"
        run: MOCK_SMOKE_IMAGE=mock-services:local MOCK_SMOKE_SKIP_BUILD=1 node scripts/docker-smoke.js
      - name: Запуск compose-стенда и ожидание healthcheck
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3910/health >/dev/null && curl -fsS http://localhost:3911/healthz >/dev/null && curl -fsS http://localhost:3912/health >/dev/null && curl -fsS http://localhost:3913/health >/dev/null && curl -fsS http://localhost:3914/health >/dev/null && curl -fsS http://localhost:3915/health >/dev/null && curl -fsS http://localhost:3916/health >/dev/null && curl -fsS http://localhost:3917/health >/dev/null && curl -fsS http://localhost:3918/health >/dev/null; then
              echo "стенд поднялся"; exit 0
            fi
            sleep 1
          done
          echo "стенд не поднялся за 30 с"; docker compose logs; exit 1
      - name: Black-box selftest против контейнеров compose (:3910–:3918)
        run: npm run test:compose
      - name: Прогон selftest-наборов внутри собранного образа
        run: |
          docker compose exec -T tbank-mock node packages/core/selftest.js
          docker compose exec -T tbank-mock node services/tbank-mock/selftest.js
          docker compose exec -T kassa-mock node services/kassa-mock/selftest.js
          docker compose exec -T yookassa-mock node services/yookassa-mock/selftest.js
          docker compose exec -T atol-mock node services/atol-mock/selftest.js
          docker compose exec -T alfa-mock node services/alfa-mock/selftest.js
          docker compose exec -T sber-mock node services/sber-mock/selftest.js
          docker compose exec -T vtb-mock node services/vtb-mock/selftest.js
          docker compose exec -T first-ofd-mock node services/first-ofd-mock/selftest.js
          # taxcom-mock и kontur-ofd-mock внутри образа не прогоняются: их selftest'ы
          # проверяют лимиты страницы (10 000 / 1000 документов) на фикстурах, пиковый
          # RSS которых выше mem_limit 128m контейнера (замер: ~137 МБ у taxcom).
          # Оба набора гоняются в job `test` на раннере без cgroup-лимита.
      - name: Логи и остановка
        if: always()
        run: docker compose down -v

  publish-ghcr:
    name: Публикация образа в GHCR
    needs: [test, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Вход в GitHub Container Registry (ghcr.io)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Вычисление тегов образа (semver + latest + sha)
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
      - name: Сборка и публикация ghcr.io/rucorp/mock-services
        run: |
          IMAGE="ghcr.io/rucorp/mock-services"
          VER="${{ steps.meta.outputs.version }}"
          SHA="${{ steps.meta.outputs.short_sha }}"
          docker build \
            -t "${IMAGE}:${VER}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-${SHA}" \
            .
          docker push "${IMAGE}:${VER}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${SHA}"
