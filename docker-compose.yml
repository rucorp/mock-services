# Стенд «банк + касса + ЮKassa + АТОЛ Онлайн + Альфа-Банк»: docker compose up
# Конфиг — переменными окружения (см. services/*/README.md).
services:
  tbank-mock:
    build: .
    image: mock-services:local
    working_dir: /app
    command: node services/tbank-mock/server.js
    # Безопасный локальный default: наружу публикуем только loopback.
    # Явный override для сетевого доступа: MOCK_TBANK_BIND_IP=0.0.0.0.
    ports: ["${MOCK_TBANK_BIND_IP:-127.0.0.1}:${MOCK_TBANK_HOST_PORT:-3100}:3100"]
    environment:
      MOCK_PORT: "3100"
      MOCK_HEALTH_PATH: /health
      MOCK_ACQAPI_CLIENT_ID: "${MOCK_ACQAPI_CLIENT_ID:-partner}"
      MOCK_ACQAPI_CLIENT_SECRET: "${MOCK_ACQAPI_CLIENT_SECRET:-partner}"
      MOCK_ACQAPI_TOKEN_TTL_MS: "${MOCK_ACQAPI_TOKEN_TTL_MS:-1h}"
      # Персистентность между рестартами: состояние на volume ниже.
      MOCK_STATE_FILE: /data/tbank-state.json
      # Публичный адрес стенда глазами покупателя (меняйте на свой домен).
      MOCK_PUBLIC_BASE_URL: "http://localhost:3100"
      # Для публичного размещения включите защиту исходящих вебхуков от SSRF:
      # MOCK_BLOCK_PRIVATE_WEBHOOKS: "1"
    volumes: ["mock-data:/data"]
    mem_limit: "${MOCK_MEM_LIMIT:-128m}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3100,path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  kassa-mock:
    build: .
    image: mock-services:local
    working_dir: /app
    command: node services/kassa-mock/server.js
    # Безопасный локальный default: наружу публикуем только loopback.
    # Явный override для сетевого доступа: MOCK_KASSA_BIND_IP=0.0.0.0.
    ports: ["${MOCK_KASSA_BIND_IP:-127.0.0.1}:${MOCK_KASSA_HOST_PORT:-3101}:3101"]
    environment:
      MOCK_PORT: "3101"
      MOCK_HEALTH_PATH: /healthz
      MOCK_STATE_FILE: /data/kassa-state.json
      # Публичный адрес кассы глазами покупателя — от него зависит ofd_receipt_url.
      MOCK_PUBLIC_BASE_URL: "http://localhost:3101"
      MOCK_GROUPS: "Main"
      # MOCK_BLOCK_PRIVATE_WEBHOOKS: "1"
    volumes: ["mock-data:/data"]
    mem_limit: "${MOCK_MEM_LIMIT:-128m}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3101,path:'/healthz'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  yookassa-mock:
    build: .
    image: mock-services:local
    working_dir: /app
    command: node services/yookassa-mock/server.js
    # Безопасный локальный default; сетевой bind включается явно.
    ports: ["${MOCK_YOOKASSA_BIND_IP:-127.0.0.1}:${MOCK_YOOKASSA_HOST_PORT:-3102}:3102"]
    environment:
      MOCK_PORT: "3102"
      MOCK_HEALTH_PATH: /health
      # Персистентность между рестартами: состояние на volume ниже.
      MOCK_STATE_FILE: /data/yookassa-state.json
      # Публичный адрес стенда глазами покупателя (confirmation_url, return-редиректы).
      MOCK_PUBLIC_BASE_URL: "http://localhost:3102"
      # Адрес приёмника вебхуков магазина (ACK по протоколу — ровно 200).
      MOCK_DEFAULT_WEBHOOK_URL: "${MOCK_DEFAULT_WEBHOOK_URL:-}"
      # Для публичного размещения включите защиту исходящих вебхуков от SSRF:
      # MOCK_BLOCK_PRIVATE_WEBHOOKS: "1"
    volumes: ["mock-data:/data"]
    mem_limit: "${MOCK_MEM_LIMIT:-128m}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3102,path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  atol-mock:
    build: .
    image: mock-services:local
    working_dir: /app
    command: node services/atol-mock/server.js
    # Безопасный локальный default; сетевой bind включается явно.
    ports: ["${MOCK_ATOL_BIND_IP:-127.0.0.1}:${MOCK_ATOL_HOST_PORT:-3103}:3103"]
    environment:
      MOCK_PORT: "3103"
      MOCK_HEALTH_PATH: /health
      # Персистентность между рестартами: состояние на volume ниже.
      MOCK_STATE_FILE: /data/atol-state.json
      # Публичный адрес стенда — от него строится ofd_receipt_url в payload.
      MOCK_PUBLIC_BASE_URL: "http://localhost:3103"
      # Дефолты — публичные тестовые реквизиты v4 (login v4-online-atol-ru,
      # группа v4-online-atol-ru_4179); свои — через эти переменные.
      # MOCK_ATOL_LOGIN / MOCK_ATOL_PASSWORD / MOCK_ATOL_GROUP / MOCK_GROUPS
      # Адрес приёмника результата по умолчанию (иначе — только report).
      # MOCK_DEFAULT_CALLBACK_URL: ""
      # Для публичного размещения включите защиту исходящих callback от SSRF:
      # MOCK_BLOCK_PRIVATE_WEBHOOKS: "1"
    volumes: ["mock-data:/data"]
    mem_limit: "${MOCK_MEM_LIMIT:-128m}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3103,path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  alfa-mock:
    build: .
    image: mock-services:local
    working_dir: /app
    command: node services/alfa-mock/server.js
    # Безопасный локальный default; сетевой bind включается явно.
    ports: ["${MOCK_ALFA_BIND_IP:-127.0.0.1}:${MOCK_ALFA_HOST_PORT:-3104}:3104"]
    environment:
      MOCK_PORT: "3104"
      MOCK_HEALTH_PATH: /health
      # Персистентность между рестартами: состояние на volume ниже.
      MOCK_STATE_FILE: /data/alfa-state.json
      # Публичный адрес стенда — от него строится formUrl платёжной страницы.
      MOCK_PUBLIC_BASE_URL: "http://localhost:3104"
      # Дефолты — СИНТЕТИЧЕСКИЕ креды мока (ALFAMOCKTEST/mockpass123, по образцу
      # TBANKMOCKTEST); реальные тестовые креды банк выдаёт индивидуально.
      # MOCK_ALFA_USERNAME / MOCK_ALFA_PASSWORD / MOCK_ALFA_CALLBACK_SECRET
      # Адрес приёмника GET-callback (иначе — только jsonParams.callback_url).
      # MOCK_DEFAULT_CALLBACK_URL: ""
      # Для публичного размещения включите защиту исходящих callback от SSRF:
      # MOCK_BLOCK_PRIVATE_WEBHOOKS: "1"
    volumes: ["mock-data:/data"]
    mem_limit: "${MOCK_MEM_LIMIT:-128m}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3104,path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

volumes:
  mock-data:
