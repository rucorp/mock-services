# Стенд «банк + касса». Конфиг — переменными окружения (см. services/*/README.md).
services:
  tbank-mock:
    image: node:22-alpine
    working_dir: /app
    command: node services/tbank-mock/server.js
    volumes: [".:/app"]
    ports: ["3100:3100"]
    environment:
      MOCK_PORT: "3100"
  kassa-mock:
    image: node:22-alpine
    working_dir: /app
    command: node services/kassa-mock/server.js
    volumes: [".:/app"]
    ports: ["3101:3101"]
    environment:
      MOCK_PORT: "3101"
