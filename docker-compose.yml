      MOCK_SANDBOX_TTL_MS: "${MOCK_SANDBOX_TTL_MS:-}"
      MOCK_SANDBOX_MAX: "${MOCK_SANDBOX_MAX:-}"
      MOCK_SANDBOX_MAX_DOCUMENTS: "${MOCK_SANDBOX_MAX_DOCUMENTS:-}"
      MOCK_SANDBOX_MAX_STATE_BYTES: "${MOCK_SANDBOX_MAX_STATE_BYTES:-}"
      MOCK_SANDBOX_GLOBAL_MAX_STATE_BYTES: "${MOCK_SANDBOX_GLOBAL_MAX_STATE_BYTES:-}"
      MOCK_SANDBOX_HOST_SUFFIX: "${MOCK_SANDBOX_HOST_SUFFIX:-}"
      MOCK_SANDBOX_CREATE_LIMIT: "${MOCK_SANDBOX_CREATE_LIMIT:-}"
    volumes: ["mock-data:/data"]
    labels:
      caddy: "${MOCK_TAXCOM_CADDY_DOMAIN:-}"
      caddy.reverse_proxy: "{{upstreams 3109}}"
    # MS-04: контейнерный харденинг. Root filesystem только для чтения,
    # единственная запись — volume /data (state), /tmp — tmpfs.
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: "${MOCK_MEM_LIMIT:-128m}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3109,path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

